[project]
name = "the-commons"
version = "0.1.0"
description = "The Commons — open library + match-maker of agent-readable ML experiment evidence"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "PI Lab" }
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "psycopg[binary,pool]>=3.2.0",
    "pgvector>=0.3.0",
    "pyjwt[crypto]>=2.9.0",
    "google-genai>=0.3.0",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "openai>=2.38.0",
    "mcp>=1.27.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-pyjwt",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/the_commons"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# stdlib → external → internal 순서 강제 (import-order rule)
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort (import order)
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
]
ignore = [
    "B008",  # FastAPI Depends()를 함수 default로 쓰는 표준 패턴 — false positive
]

[tool.ruff.lint.isort]
known-first-party = ["the_commons"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --strict-markers"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
