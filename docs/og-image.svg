<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img"
     aria-label="The Commons — an open library and match-maker of agent-readable ML experiment evidence">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f8f5"/>
      <stop offset="1" stop-color="#e7f2ea"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="56" y="56" width="120" height="90" rx="14" fill="#0f5132"/>
  <text x="116" y="120" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="44" font-weight="800" fill="#e7f2ea">TC</text>
  <text x="56" y="262"
        font-family="Inter, system-ui, sans-serif"
        font-size="62" font-weight="800" fill="#17202a">Keep the evidence.</text>
  <text x="56" y="342"
        font-family="Inter, system-ui, sans-serif"
        font-size="62" font-weight="800" fill="#17202a">Tell them what to read next.</text>
  <text x="56" y="420"
        font-family="Inter, system-ui, sans-serif"
        font-size="27" font-weight="600" fill="#5a6675">
    Cross-user ML experiment library + match-maker · negatives are first-class
  </text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
     font-size="25" font-weight="700" fill="#0f5132">
    <text x="56" y="520">pcq writes the books · cq prints them</text>
    <text x="56" y="558">The Commons keeps them — and ranks them</text>
  </g>
  <text x="1144" y="600" text-anchor="end"
        font-family="Inter, system-ui, sans-serif"
        font-size="22" font-weight="700" fill="#0f5132">playidea-lab.github.io/TC</text>
</svg>
