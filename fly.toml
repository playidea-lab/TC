# The Commons — fly.io 경량 dev 배포 (영속 도서관)
# DB: TC 전용 Supabase (secret DATABASE_URL). prod 승격 시 DD4 전용 PG로 이전(corpus export).
# JWT: cq 발급 토큰을 pub key로 검증 (secret CQ_JWT_PUBLIC_KEY 또는 파일).
# 배포: fly secrets set ... && fly deploy

app = "the-commons"
primary_region = "syd"   # Supabase가 ap-southeast-2(시드니) — DB 근접

[build]
  dockerfile = "Dockerfile"

[env]
  # 비밀 아닌 설정만. DATABASE_URL은 secret.
  CQ_JWT_ISSUER = "cq.pilab.kr"
  CQ_JWT_AUDIENCE = "the-commons"
  CQ_JWT_PUBLIC_KEY_PATH = "/app/cq_pub.pem"   # 이미지에 COPY된 공개키

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"     # 유휴 시 정지(비용 절감, dev)
  auto_start_machines = true      # 요청 오면 기동
  min_machines_running = 0        # dev: 0까지 (요청 시 cold start)

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
